<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#F6D36E"/>
      <stop offset="1" stop-color="#F2C94C"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#g1)" />

  <!-- stylized jaguar face (simple) -->
  <g transform="translate(80,40) scale(0.9)">
    <ellipse cx="220" cy="160" rx="120" ry="140" fill="#8A4B2C" opacity="0.12"/>
    <circle cx="160" cy="140" r="36" fill="#3B2A20" />
    <circle cx="280" cy="140" r="36" fill="#3B2A20" />
    <path d="M160 220 Q220 260 280 220" stroke="#3B2A20" stroke-width="18" stroke-linecap="round" fill="none" />

    <!-- spots -->
    <g fill="#3B2A20">
      <ellipse cx="90" cy="60" rx="18" ry="12" />
      <ellipse cx="50" cy="140" rx="16" ry="10" />
      <ellipse cx="120" cy="200" rx="22" ry="14" />
      <ellipse cx="330" cy="60" rx="18" ry="12" />
      <ellipse cx="360" cy="150" rx="16" ry="10" />
      <ellipse cx="300" cy="210" rx="22" ry="14" />
    </g>
  </g>

  <!-- subtle border -->
  <rect x="10" y="10" width="580" height="380" rx="18" fill="none" stroke="#5A3928" stroke-opacity="0.08" stroke-width="8" />
</svg>